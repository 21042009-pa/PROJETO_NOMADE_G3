<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NÔMADE - Sistema de Estoque</title>
  <link rel="stylesheet" href="src/styles/style.css">
</head>
<body>

  <!-- ========== TELA DE LOGIN ========== -->
  <div class="login-pagina" id="tela-login">
    <div class="login-caixa">
      <div class="logo">NÔ<span>M</span>ADE</div>
      <p class="subtitulo">Acesse o painel de estoque</p>

      <!-- Ao enviar este formulário, o JS esconde o login e mostra o sistema -->
      <form id="form-login">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="••••••••" required>
        </div>
        <div class="campo">
          <label for="unidade">Unidade</label>
          <select id="unidade">
            <option>Matriz</option>
            <option>Filial 01</option>
            <option>Filial 02</option>
          </select>
        </div>
        <button type="submit" class="btn btn-laranja btn-largo">Entrar</button>
        <a href="#" class="link">Esqueci minha senha</a>
      </form>
    </div>
  </div>

  <!-- ========== SISTEMA (aparece depois do login) ========== -->
  <div class="layout oculto" id="app">

    <!-- Menu lateral -->
    <aside class="sidebar">
      <div>
        <div class="logo">NÔ<span>M</span>ADE</div>
        <nav class="menu">
        <!-- href com # não abre outra página: o JS troca a tela. A classe 'ativo' marca o item atual -->
        <a href="#dashboard" class="ativo">📊 Painel de Controle</a>
        <a href="#estoque">📦 Estoque</a>
        <a href="#cadastro">🏷️ Produtos</a>
        <a href="#equipe">👥 Equipe</a>
        <a href="#configuracoes">⚙️ Configurações</a>
        </nav>
      </div>
      <nav class="menu">
        <a href="#suporte">❓ Suporte</a>
        <a href="#sair">🚪 Sair</a>
      </nav>
    </aside>
